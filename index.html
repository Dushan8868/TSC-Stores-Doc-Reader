async function init(){
  S.mode='standalone'; S.tab='scan'; S.from='scan'; S.loaded=true; S.connected=false; S.monthAuto=false; S.month='all';
  S.remember=lsGet('sir.remember')!=='0'; S.apiKey=lsGet('sir.apiKey')||''; S.model=lsGet('sir.model')||'claude-opus-5-5';
  S.sample=apiSample(); S.downloads=browserDownloads(); S.aiImages=!!S.apiKey; S.aiChecked=true; S.imgMax=5; S.scan.depth=lsGet('sir.depth')||'thorough'; S.scan.par=+(lsGet('sir.par')||2); S.scan.verify=lsGet('sir.verify')!=='0';
  bindEvents();
  if(cloudWanted()){
    if(!cloudReady()){ S.tab='signin'; CLOUD.loginErr='The shared database could not be reached. Check the internet connection and reload the page.'; render(); return; }
    CLOUD.on=true;
    try{ const {data}=await cloudClient().auth.getSession(); CLOUD.user=data&&data.session&&data.session.user||null; }catch(e){}
    if(!CLOUD.user){ S.tab='signin'; render(); return; }
    await cloudStart(); return;
  }
  if(!S.apiKey) S.tab='settings';
  render();
  let n=0;
  try{ await idb(); n=await restoreBatch(); try{ S.sap=await loadSapData(); }catch(e){} }
  catch(e){ if(idbBlocked) setBanner(BLOCKED_MSG); else setBanner('Saved work could not be opened on this computer ('+((e&&e.message)||'storage error')+'). You can still read scans and download the report, but nothing is kept after closing.'); }
  if(n){ render(); toast(pl(n,'page')+' from your last session '+(n===1?'is':'are')+' back in the report.'); }
  else if(!S.apiKey) toast('Add the Claude API key to start reading scans.');
}


/* ---- shared database (Supabase): everyone who signs in sees the same slips, scans, SAP data and G/L mapping ---- */
const CLOUD={on:false,client:null,user:null,lastSync:'',timers:new Map(),asked:new Set(),busy:false,poll:0,err:''};
function sbBase(v){ const t=String(v||'').trim(); if(!t) return ''; try{ return new URL(t).origin; }catch(e){ return t.replace(/\/(rest|auth|storage)\/v1.*$/i,'').replace(/\/+$/,''); } }
function cloudConf(){ const c=window.SIR_CONFIG||{}, u=sbBase(lsGet('sir.sbUrl')), k=(lsGet('sir.sbKey')||'').trim(); return {url:u||sbBase(c.supabaseUrl),key:k||String(c.supabaseKey||'').trim(),fromFile:!u&&!!c.supabaseUrl}; }
function cloudWanted(){ const c=cloudConf(); return !!(c.url&&c.key); }
function cloudReady(){ return cloudWanted()&&!!(window.supabase&&window.supabase.createClient); }
function cloudClient(){ if(!CLOUD.client){ const c=cloudConf(); CLOUD.client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sir-auth'}}); } return CLOUD.client; }
function cloudWho(){ return CLOUD.user&&(CLOUD.user.email||CLOUD.user.id)||''; }
function cloudErr(e,what){ const m=(e&&(e.message||e.error_description||e.code))||'unknown error'; CLOUD.err=m; setBanner('Could not '+(what||'save to the shared database')+': '+m+'. Check the internet connection; your last change may not be saved yet.'); }
const PAGE_COLS='key,file_key,name,page_no,ord,status,checked,manual,rot,ai_rot,draft,has_image,updated_at,deleted';
function rowToPage(r,ex){
  const id=ex?ex.id:'pg'+Math.random().toString(36).slice(2,9), d=r.draft||null; if(d) d.fromScan=id;
  return Object.assign(ex||{blob:null,thumb:'',error:'',preview:''},{id,name:r.name||'',pageNo:r.page_no||0,fileKey:r.file_key||'',key:r.key,rot:r.rot||0,aiRot:r.ai_rot||0,status:d?(r.status==='saved'?'saved':'read'):'new',draft:d,checked:!!r.checked,manual:!!r.manual,order:+r.ord||0,remoteImage:!!r.has_image,rotKnown:true});
}
function pageToRow(pg){
  const d=pg.draft?JSON.parse(JSON.stringify(pg.draft)):null;
  return {key:pg.key,file_key:pg.fileKey||'',name:pg.name||'',page_no:pg.pageNo||0,ord:pg.order||0,status:pg.status==='saved'?'saved':(d?'read':'new'),checked:!!pg.checked,manual:!!pg.manual,rot:pg.rot||0,ai_rot:pg.aiRot||0,draft:d,
    month:d&&/^\d{4}-\d{2}/.test(d.date||'')?d.date.slice(0,7):'',doc_nos:d?[...new Set([d.docNo,...(d.lines||[]).map(l=>l.lineDoc)].filter(x=>/^\d{6,}$/.test(x||'')))].join(' '):'',updated_by:cloudWho(),deleted:false};
}
async function cloudLoadAll(){
  const sb=cloudClient(), out=[]; let from=0;
  for(;;){ const {data,error}=await sb.from('slip_pages').select(PAGE_COLS).eq('deleted',false).order('ord',{ascending:true}).range(from,from+999); if(error) throw error; out.push(...(data||[])); if(!data||data.length<1000) break; from+=1000; }
  S.scan.pages=out.map(r=>rowToPage(r));
  CLOUD.lastSync=out.reduce((m,r)=>r.updated_at>m?r.updated_at:m,'')||'1970-01-01T00:00:00Z';
  return out.length;
}
function cloudSavePage(pg){ if(!pg||!pg.key||pg.status==='reading') return; clearTimeout(CLOUD.timers.get(pg.key)); CLOUD.timers.set(pg.key,setTimeout(()=>cloudPushPage(pg),700)); }
async function cloudPushPage(pg){
  CLOUD.timers.delete(pg.key);
  const row=pageToRow(pg); if(pg.remoteImage) row.has_image=true;
  const {error}=await cloudClient().from('slip_pages').upsert(row,{onConflict:'key'});
  if(error) cloudErr(error); else if(CLOUD.err){ CLOUD.err=''; setBanner(''); }
}
async function cloudFlush(){ const ks=[...CLOUD.timers.keys()]; for(const k of ks){ clearTimeout(CLOUD.timers.get(k)); const pg=S.scan.pages.find(p=>p.key===k); if(pg) await cloudPushPage(pg); else CLOUD.timers.delete(k); } }
async function cloudUploadImage(pg){
  if(!pg.blob||!pg.key) return false;
  try{
    let up=pg.blob;
    try{ const bmp=await createImageBitmap(pg.blob), k=Math.min(1,2000/Math.max(bmp.width,bmp.height)); if(k<1){ const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); up=await toBlob(c,'image/jpeg',0.82)||pg.blob; } if(bmp.close) bmp.close(); }catch(e){}
    const {error}=await cloudClient().storage.from('scans').upload(pg.key+'.jpg',up,{upsert:true,contentType:'image/jpeg'});
    if(error){ cloudErr(error,'save the scan image'); return false; }
    pg.remoteImage=true; return true;
  }catch(e){ cloudErr(e,'save the scan image'); return false; }
}
async function cloudBulkSave(pages,label){
  const sb=cloudClient(), list=[...new Map((pages||[]).filter(p=>p&&p.key).map(p=>[p.key,p])).values()];
  let rows=0, imgs=0, fail=0;
  for(let i=0;i<list.length;i+=50){
    const chunk=list.slice(i,i+50).map(p=>Object.assign(pageToRow(p),p.remoteImage?{has_image:true}:{}));
    const {error}=await sb.from('slip_pages').upsert(chunk,{onConflict:'key'});
    if(error){ fail+=chunk.length; cloudErr(error); } else rows+=chunk.length;
    setBanner((label||'Saving to the shared database')+': '+rows+' of '+list.length+' slips…');
  }
  const todo=list.filter(p=>p.blob&&!p.remoteImage);
  for(let i=0;i<todo.length;i++){ if(await cloudUploadImage(todo[i])) imgs++; else fail++; setBanner('Saving the scans to the shared database: '+(i+1)+' of '+todo.length+'…'); }
  const done=todo.filter(p=>p.remoteImage);
  for(let i=0;i<done.length;i+=25){ const {error}=await sb.from('slip_pages').upsert(done.slice(i,i+25).map(p=>Object.assign(pageToRow(p),{has_image:true,thumb:p.thumb||null})),{onConflict:'key'}); if(error){ cloudErr(error); fail++; } }
  setBanner(fail?'Some items could not be saved to the shared database ('+fail+'). Open Settings and press "Upload everything shown here" to try again.':'');
  return {rows,imgs,fail};
}
async function cloudCounts(){
  try{ const sb=cloudClient(), a=await sb.from('slip_pages').select('key',{count:'exact',head:true}).eq('deleted',false), b=await sb.from('slip_pages').select('key',{count:'exact',head:true}).eq('deleted',false).eq('has_image',true); return {pages:a.count||0,imgs:b.count||0,ok:!a.error}; }
  catch(e){ return {pages:0,imgs:0,ok:false}; }
}
async function localLeftovers(){ try{ await idb(); }catch(e){ return []; } return (await idbAll('batch')).filter(r=>r&&r.key&&!S.scan.pages.some(p=>p.key===r.key)); }
async function cloudSettingsStatus(){
  const st=$('#cl-status'), lo=$('#cl-local'); if(!st) return;
  const c=await cloudCounts();
  st.textContent=c.ok?'The shared database holds '+pl(c.pages,'slip')+' ('+pl(c.imgs,'scan')+'). This screen shows '+pl(S.scan.pages.length,'slip')+'.':'The shared database could not be counted. Check the internet connection.';
  const left=await localLeftovers();
  if(lo) lo.innerHTML=left.length?'This computer still has <b>'+pl(left.length,'slip')+'</b> saved before the shared database was connected. <button type="button" class="btn" data-act="cloudCopyLocal">Copy them to the shared database</button>':'';
}
async function cloudCopyLocal(){
  const recs=await localLeftovers(), add=[];
  for(const r of recs){ const id='pg'+Math.random().toString(36).slice(2,9), d=r.draft||null; if(d) d.fromScan=id; const im=await idbGet('images',r.key);
    add.push({id,name:r.name,pageNo:r.page,fileKey:r.fileKey,key:r.key,blob:im&&im.blob||null,thumb:im&&im.thumb||'',rot:r.rot||0,aiRot:r.aiRot||0,rotKnown:true,status:d?'read':'new',draft:d,error:'',preview:'',checked:!!r.checked,manual:!!r.manual,order:r.order||0}); }
  S.scan.pages.push(...add); S.scan.pages.sort((a,b)=>(a.order||0)-(b.order||0));
  const res=await cloudBulkSave(add,'Copying this computer’s work to the shared database');
  toast(pl(res.rows,'slip')+' and '+pl(res.imgs,'scan')+' copied to the shared database'+(res.fail?' – '+res.fail+' could not be saved':'')+'.'); cloudSettingsStatus();
}
async function cloudSaveImage(pg){
  if(!pg.blob||!pg.key) return;
  try{
    let up=pg.blob;
    try{ const bmp=await createImageBitmap(pg.blob), k=Math.min(1,2000/Math.max(bmp.width,bmp.height)); if(k<1){ const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); up=await toBlob(c,'image/jpeg',0.82)||pg.blob; } if(bmp.close) bmp.close(); }catch(e){}
    const sb=cloudClient(), {error}=await sb.storage.from('scans').upload(pg.key+'.jpg',up,{upsert:true,contentType:'image/jpeg'});
    if(error){ cloudErr(error,'save the scan image'); return; }
    pg.remoteImage=true;
    const row=Object.assign(pageToRow(pg),{has_image:true,thumb:pg.thumb||null}), r2=await sb.from('slip_pages').upsert(row,{onConflict:'key'});
    if(r2.error) cloudErr(r2.error);
  }catch(e){ cloudErr(e,'save the scan image'); }
}
async function cloudBlob(pg){
  if(!pg||pg.blob||!pg.remoteImage||!CLOUD.on) return pg&&pg.blob;
  const {data,error}=await cloudClient().storage.from('scans').download(pg.key+'.jpg');
  if(error||!data) return null; pg.blob=data; return data;
}
async function cloudThumbs(){
  if(!CLOUD.on) return;
  const want=S.scan.pages.filter(p=>!p.thumb&&p.remoteImage&&!CLOUD.asked.has(p.key)).map(p=>p.key).slice(0,200);
  if(!want.length) return; want.forEach(k=>CLOUD.asked.add(k));
  for(let i=0;i<want.length;i+=100){
    const {data,error}=await cloudClient().from('slip_pages').select('key,thumb').in('key',want.slice(i,i+100)); if(error) return;
    for(const r of data||[]){ const p=S.scan.pages.find(x=>x.key===r.key); if(p&&r.thumb) p.thumb=r.thumb; }
  }
  if(S.tab==='scan'&&S.scan.view==='pages'&&!isTyping()) refreshScan(true);
}
async function cloudDelete(pages){
  const keys=(pages||[]).map(p=>p.key).filter(Boolean); if(!keys.length) return;
  const sb=cloudClient(), {error}=await sb.from('slip_pages').update({deleted:true,updated_by:cloudWho()}).in('key',keys);
  if(error){ cloudErr(error,'remove the page'); return; }
  await sb.storage.from('scans').remove(keys.map(k=>k+'.jpg'));
}
function isTyping(){ const a=document.activeElement; return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
async function cloudSync(){
  if(!CLOUD.on||CLOUD.busy||!CLOUD.user) return; CLOUD.busy=true;
  try{
    const {data,error}=await cloudClient().from('slip_pages').select(PAGE_COLS).gt('updated_at',CLOUD.lastSync).order('updated_at',{ascending:true}).limit(1000);
    if(error) throw error;
    let changed=0; const editing=S.editor&&S.editor.fromScan;
    for(const r of data||[]){
      if(r.updated_at>CLOUD.lastSync) CLOUD.lastSync=r.updated_at;
      const ex=S.scan.pages.find(p=>p.key===r.key);
      if(ex&&(ex.id===editing||CLOUD.timers.has(ex.key)||ex.status==='reading')) continue;
      if(r.deleted){ if(ex){ S.scan.pages=S.scan.pages.filter(p=>p!==ex); changed++; } continue; }
      if(ex){ const hadImg=ex.remoteImage; rowToPage(r,ex); if(!hadImg&&ex.remoteImage) CLOUD.asked.delete(ex.key); }
      else S.scan.pages.push(rowToPage(r));
      changed++;
    }
    if(changed){ S.scan.pages.sort((a,b)=>(a.order||0)-(b.order||0)); if(S.tab==='scan'&&!isTyping()) refreshScan(true); else if(S.tab==='sap'&&!isTyping()) render(); }
    try{ const sm=await cloudClient().from('sap_months').select('month,loaded_at'); const mx=(sm.data||[]).reduce((m,r)=>r.loaded_at>m?r.loaded_at:m,''); if(!sm.error&&mx!==(CLOUD.sapAt||'')){ S.sap=await cloudLoadSap(); CLOUD.sapAt=mx; if(S.tab==='sap'&&!isTyping()) render(); } await cloudLoadSettings(); }catch(e){}
    renderChrome();
  }catch(e){ /* try again at the next round */ }
  CLOUD.busy=false;
}
async function cloudSaveSap(d){
  const sb=cloudClient();
  if(!d){ const {error}=await sb.from('sap_months').delete().neq('month',''); if(error) cloudErr(error,'remove the SAP data'); return; }
  for(const [m,ls] of groupBy(d.lines,l=>l.month||'none')){ const {error}=await sb.from('sap_months').upsert({month:m,lines:ls,file:d.file||'',loaded_by:cloudWho()},{onConflict:'month'}); if(error){ cloudErr(error,'save the SAP data'); return; } }
}
async function cloudLoadSap(){
  const {data,error}=await cloudClient().from('sap_months').select('month,lines,file,loaded_at').order('month',{ascending:true}); if(error) throw error;
  if(!data||!data.length) return null;
  return {lines:data.flatMap(r=>r.lines||[]),file:[...new Set(data.map(r=>r.file).filter(Boolean))].join('; '),at:data.reduce((m,r)=>r.loaded_at>m?r.loaded_at:m,'')};
}
async function cloudSaveSetting(k,v){ const {error}=await cloudClient().from('app_settings').upsert({key:k,value:v,updated_by:cloudWho()},{onConflict:'key'}); if(error) cloudErr(error,'save the setting'); }
async function cloudLoadSettings(){ const {data,error}=await cloudClient().from('app_settings').select('key,value'); if(error) throw error; for(const r of data||[]){ if(r.key==='glmap') S.glmap=r.value||{}; if(r.key==='glsrc') S.glsrc=String(r.value||'51570000'); } }
async function cloudStart(){
  $('#main').innerHTML='<div class="empty">Opening the shared database…</div>';
  try{
    const n=await cloudLoadAll();
    try{ S.sap=await cloudLoadSap(); CLOUD.sapAt=S.sap&&S.sap.at||''; }catch(e){ S.sap=null; }
    try{ await cloudLoadSettings(); }catch(e){}
    S.tab='scan'; S.aiImages=true; render();
    toast(pl(n,'page')+' in the shared database.');
  }catch(e){ S.tab='signin'; CLOUD.loginErr='The shared database could not be opened: '+((e&&e.message)||'unknown error')+'. Check that the setup script was run in Supabase.'; render(); return; }
  clearInterval(CLOUD.poll); CLOUD.poll=setInterval(cloudSync,60000);
  window.addEventListener('focus',()=>cloudSync());
  window.addEventListener('beforeunload',e=>{ if(CLOUD.timers.size){ cloudFlush(); e.preventDefault(); e.returnValue=''; } });
}
async function cloudSignIn(){
  const em=($('#li-email')||{}).value||'', pw=($('#li-pass')||{}).value||'';
  if(!em.trim()||!pw){ CLOUD.loginErr='Enter your email and password.'; render(); return; }
  const btn=$('#li-go'); if(btn){ btn.disabled=true; btn.textContent='Signing in…'; }
  const {data,error}=await cloudClient().auth.signInWithPassword({email:em.trim(),password:pw});
  if(error||!data||!data.user){ CLOUD.loginErr=(error&&error.message)||'Sign-in failed.'; render(); return; }
  CLOUD.user=data.user; CLOUD.loginErr=''; await cloudStart();
}
async function cloudSignOut(){ await cloudFlush(); try{ await cloudClient().auth.signOut(); }catch(e){} location.reload(); }
function viewSignIn(){
  const c=cloudConf();
  return '<section class="guide" style="max-width:460px"><h1>Sign in</h1><p class="lede">This register is shared by the stores team and accounts. Sign in with the email and password you were given.</p>'+
   '<div class="slip" style="padding:16px 18px"><div class="fields" style="padding:0;grid-template-columns:1fr">'+
   '<label>Email<input type="email" id="li-email" autocomplete="username" value="'+esc(lsGet('sir.lastEmail')||'')+'"></label>'+
   '<label>Password<input type="password" id="li-pass" autocomplete="current-password"></label></div>'+
   '<div class="actions" style="padding:14px 0 0"><button type="button" class="btn" id="li-go" data-act="cloudSignIn">Sign in</button></div>'+
   (CLOUD.loginErr?'<p class="hint" style="color:var(--stamp)">'+esc(CLOUD.loginErr)+'</p>':'')+'</div>'+
   '<p class="hint">Shared database: '+esc(c.url)+'. No account yet? Ask the administrator to add you in Supabase.</p></section>';
}
function cloudSettingsHTML(){
  const c=cloudConf(), on=CLOUD.on&&CLOUD.user;
  return '<h2>Shared database</h2>'+(on
   ?'<p>Connected to <b>'+esc(c.url)+'</b> as <b>'+esc(cloudWho())+'</b>. Slips, scans, corrections, the SAP data and the G/L mapping are shared with everyone who signs in. Changes from others appear within a minute.</p><p class="hint" id="cl-status">Checking the shared database…</p><p id="cl-local"></p><p><button type="button" class="btn ghost" data-act="cloudSync">Get the latest now</button> <button type="button" class="btn ghost" data-act="cloudRepush">Upload everything shown here</button> <button type="button" class="btn ghost" data-act="cloudSignOut">Sign out</button></p>'
   :'<p>Not connected – the work is kept on this computer only. To share it, enter the Supabase project URL and the anon public key (Supabase → Project settings → API), then sign in.</p>')+
   (c.fromFile?'<p class="hint">The connection comes from config.js next to this page.</p>':
   '<div class="fields" style="padding:0;grid-template-columns:1fr"><label>Supabase project URL<input id="s-sburl" value="'+esc(lsGet('sir.sbUrl')||'')+'" placeholder="https://xxxx.supabase.co" spellcheck="false"></label><label>Anon public key<input id="s-sbkey" value="'+esc(lsGet('sir.sbKey')||'')+'" spellcheck="false"></label></div><p><button type="button" class="btn ghost" data-act="cloudSave">Save and connect</button>'+(lsGet('sir.sbUrl')?' <button type="button" class="link" data-act="cloudForget">Stop using the shared database on this computer</button>':'')+'</p>');
}
function cloudAct(a){
  const k=a.dataset.act;
  if(k==='cloudSignIn'){ lsSet('sir.lastEmail',(($('#li-email')||{}).value||'').trim()); cloudSignIn(); return true; }
  if(k==='cloudSignOut'){ cloudSignOut(); return true; }
  if(k==='cloudSync'){ cloudSync().then(()=>{ toast('Up to date.'); cloudSettingsStatus(); }); return true; }
  if(k==='cloudRepush'){ a.disabled=true; cloudBulkSave(S.scan.pages,'Uploading everything shown here').then(r=>{ a.disabled=false; toast(pl(r.rows,'slip')+' and '+pl(r.imgs,'scan')+' saved to the shared database'+(r.fail?' – '+r.fail+' failed':'')+'.'); cloudSettingsStatus(); }); return true; }
  if(k==='cloudCopyLocal'){ a.disabled=true; cloudCopyLocal(); return true; }
  if(k==='cloudSave'){ const u=(($('#s-sburl')||{}).value||'').trim(), key=(($('#s-sbkey')||{}).value||'').trim(); if(!/^https:\/\/.+/.test(u)||key.length<20){ toast('Enter the project URL (https://…) and the anon key.'); return true; } lsSet('sir.sbUrl',u); lsSet('sir.sbKey',key); location.reload(); return true; }
  if(k==='cloudForget'){ if(armed(a,'Click again – this computer will work on its own')){ lsSet('sir.sbUrl',''); lsSet('sir.sbKey',''); location.reload(); } return true; }
  return false;
}

document.addEventListener('keydown',ev=>{ const t=ev.target; if(ev.key==='Enter'&&t&&(t.id==='li-pass'||t.id==='li-email')){ ev.preventDefault(); lsSet('sir.lastEmail',(($('#li-email')||{}).value||'').trim()); cloudSignIn(); } });

init();
})();
</script>
