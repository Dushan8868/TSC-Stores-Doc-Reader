<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stores Issue Register – The Sustainable City (standalone)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#EEF2F5;--paper:#FFFFFF;--paper-2:#F6F8FA;--ink:#17202A;--ink-2:#475565;--ink-3:#6B7887;
  --rule:#C8D2DC;--rule-2:#E2E8EE;--pen:#1C3E96;--pen-2:#14307A;--pen-soft:#E5ECFA;
  --ok:#22704C;--ok-soft:#DFF0E6;--warn:#875A08;--warn-soft:#FAEFD3;--stamp:#AE2A20;--stamp-soft:#FAE2DE;
  --font:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181F;--paper:#18222C;--paper-2:#1D2935;--ink:#E2E8EE;--ink-2:#ADB9C5;--ink-3:#8593A1;
  --rule:#32455A;--rule-2:#273646;--pen:#A5BDFF;--pen-2:#C6D5FF;--pen-soft:#213257;
  --ok:#7AD0A3;--ok-soft:#1A3829;--warn:#E8BF6E;--warn-soft:#3A2E19;--stamp:#FF9187;--stamp-soft:#45201C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181F;--paper:#18222C;--paper-2:#1D2935;--ink:#E2E8EE;--ink-2:#ADB9C5;--ink-3:#8593A1;
  --rule:#32455A;--rule-2:#273646;--pen:#A5BDFF;--pen-2:#C6D5FF;--pen-soft:#213257;
  --ok:#7AD0A3;--ok-soft:#1A3829;--warn:#E8BF6E;--warn-soft:#3A2E19;--stamp:#FF9187;--stamp-soft:#45201C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand .app{font-weight:700;font-size:17px;line-height:1.15}
.brand .site{font-size:13px;color:var(--ink-3)}
.tools{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--ink-2)}
.tools select{margin-left:6px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.who{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{max-width:1320px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 10px 9px;border-bottom:3px solid transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--pen);border-bottom-color:var(--pen);font-weight:700}
.tabs .count{font-size:12px;color:var(--ink-3);margin-left:5px;font-weight:400}
.banner{max-width:1280px;margin:12px auto 0;padding:10px 14px;border:1px solid var(--rule);border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:6px}
main{max-width:1320px;margin:0 auto;padding:18px 20px 64px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:22px 0 8px}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:10px}
.lede{color:var(--ink-2);margin:0 0 14px;max-width:80ch}
.hint{color:var(--ink-3);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);border-radius:6px}
/* the slip */
.slip{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding-bottom:0}
.slip-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 18px 12px;border-bottom:3px double var(--rule)}
.slip-title{font-weight:700;font-size:18px}
.slip-title small{display:block;font-weight:400;font-size:13px;color:var(--ink-3);max-width:60ch}
.stamp{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2)}
.stamp input{border:2px solid var(--pen);border-radius:4px;color:var(--pen);font-weight:700;font-size:22px;letter-spacing:.06em;width:16ch;padding:4px 9px;background:transparent;font-variant-numeric:tabular-nums}
.stamp input::placeholder{color:var(--ink-3);font-weight:400;font-size:17px;letter-spacing:.02em}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px;padding:14px 18px}
.fields label,.foot label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2)}
.fields select{padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);font-size:15px;color:var(--ink)}
.fields input,.foot input{padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);font-size:15px;color:var(--ink)}
.lines-wrap{overflow-x:auto;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
table.lines{border-collapse:collapse;width:100%;min-width:1280px}
.lines th{font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:left;padding:7px 6px;background:var(--paper-2);border-bottom:1px solid var(--rule)}
.lines td{padding:4px 6px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.lines td.n{color:var(--ink-3);padding-top:11px;width:28px;text-align:right}
.lines input,.lines select{width:100%;padding:6px 7px;border:1px solid transparent;border-bottom-color:var(--rule);border-radius:3px;background:transparent}
.lines input:hover,.lines select:hover{border-color:var(--rule)}
.lines input:focus,.lines select:focus{border-color:var(--pen);background:var(--paper)}
.w-mat{min-width:240px}.w-loc{min-width:160px}
.cell{display:flex;align-items:center;gap:2px}
.cell .cd{padding:3px 5px;font-size:13px;color:var(--pen)}
.cell .cd:hover{background:var(--pen-soft);color:var(--pen)}
.lines input.w-qty{width:74px;text-align:right}
tr.st-struck td{background:var(--stamp-soft)}
tr.st-struck input[data-f="desc"]{text-decoration:line-through}
tr.st-x td{background:var(--warn-soft)}
.lines tr.hl td{background:var(--pen-soft)}
.lines tr.hl td.n{color:var(--pen);font-weight:700}
.loc{font-size:12px;color:var(--ink-3);padding:2px 7px 0;min-height:4px}
.loc b{color:var(--ink-2)}
tr.flagrow td{background:var(--stamp-soft);color:var(--stamp);font-size:13px;padding:5px 8px}
tr.noterow td{font-size:12.5px;color:var(--ink-3);padding:2px 8px 6px;border-bottom:1px solid var(--rule-2)}
.foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 2fr;gap:12px 16px;padding:14px 18px 0}
.savebar{position:sticky;bottom:0;z-index:15;margin-top:14px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--rule);box-shadow:0 -6px 14px rgba(0,0,0,.07);border-radius:0 0 6px 6px}
.savebar .status{font-size:13px;color:var(--ok);margin-left:auto}
.savebar .status.dirty{color:var(--warn)}
.msgs{padding:0 18px}
.msgs ul{margin:12px 0 0;padding-left:18px}
.msgs .err{color:var(--stamp)}
.msgs .warn{color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px 0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--pen);background:var(--pen);color:var(--paper);cursor:pointer;font-weight:700}
.btn:hover{background:var(--pen-2);border-color:var(--pen-2)}
.btn.ghost{background:transparent;color:var(--pen)}
.btn.ghost:hover{background:var(--pen-soft)}
.btn.danger{background:transparent;color:var(--stamp);border-color:var(--stamp)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--pen);text-decoration:underline;cursor:pointer}
.icon{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:6px 8px;border-radius:4px;font-size:15px}
.icon:hover{color:var(--stamp);background:var(--stamp-soft)}
.chip{display:inline-block;font-size:12px;line-height:1.55;padding:0 6px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.chip.pending{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.flag{background:var(--stamp-soft);border-color:transparent;color:var(--stamp)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.pen{background:var(--pen-soft);border-color:transparent;color:var(--pen)}
/* lists and reports */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:4px 0 12px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2)}
.filters input,.filters select{padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:var(--paper)}
.filters input[type=search]{min-width:260px}
.tbl{overflow:auto;max-height:72vh;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table.data{border-collapse:collapse;width:100%;font-size:14px}
.data th{position:sticky;top:0;background:var(--paper-2);text-align:left;font-size:12.5px;color:var(--ink-2);padding:8px;border-bottom:1px solid var(--rule);white-space:nowrap;z-index:1}
.data td{padding:7px 8px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.data .num{text-align:right;font-variant-numeric:tabular-nums}
.data tr.click{cursor:pointer}
.data tr.click:hover td{background:var(--pen-soft)}
.data tr.warnrow td{background:var(--warn-soft)}
.data td.doc{font-weight:700;color:var(--pen);white-space:nowrap;font-variant-numeric:tabular-nums}
.data td.wrap{min-width:200px}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.subtabs button{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:6px 11px;cursor:pointer;color:var(--ink-2)}
.subtabs button[aria-pressed="true"]{border-color:var(--pen);color:var(--pen);background:var(--pen-soft);font-weight:700}
/* scanning */
.drop{border:2px dashed var(--rule);border-radius:8px;background:var(--paper);padding:22px;text-align:center}
.drop.over{border-color:var(--pen);background:var(--pen-soft)}
.drop p{margin:6px 0}
.scan-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:14px 0}
.scan-bar select{padding:5px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--paper)}
.pages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pg{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pg .thumb{height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper-2);border-radius:4px}
.pg .thumb img{max-width:100%;max-height:100%;transition:transform .2s}
.pg .meta{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:6px}
.pg .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pg .err{font-size:12.5px;color:var(--stamp)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:16px;align-items:start}
.scanview{position:sticky;top:110px;margin:0;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px}
.scanview .imgbox{max-height:74vh;overflow:auto;background:var(--paper-2);border-radius:4px}
.scanview img{display:block;width:100%;height:auto;max-width:none}
.scanview .tools{display:flex;gap:2px;align-items:center}
.scanview .tools .icon{min-width:34px;border:1px solid var(--rule);background:var(--paper)}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scanview .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:2px 2px 8px}
.prog{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}.prog progress{flex:1;max-width:560px;height:10px;accent-color:var(--pen)}.prog span{font-size:13px;color:var(--ink-3)}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.rep-head h2{margin:10px 0 2px}.rep-head .row{display:flex;flex-wrap:wrap;gap:8px}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.38);z-index:55}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,97vw);background:var(--paper);border-left:1px solid var(--rule);box-shadow:-10px 0 28px rgba(0,0,0,.2);z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.drawer .db{overflow:auto;padding:12px 16px 24px;flex:1}
.drawer .imgbox{max-height:56vh;overflow:auto;background:var(--paper-2);border-radius:4px;border:1px solid var(--rule-2)}
.drawer .imgbox img{display:block;max-width:none;height:auto}
.drawer .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:0 0 8px}
.drawer .tools{display:flex;gap:2px}.drawer .tools .icon{min-width:34px;border:1px solid var(--rule);background:var(--paper)}
.kv2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;font-size:14px;margin:14px 0 8px}
.kv2 div{padding:3px 6px;border-radius:3px}.kv2 div span{display:block;color:var(--ink-3);font-size:12px}
.unsure{background:var(--warn-soft)!important;box-shadow:inset 0 0 0 1px var(--warn)}
input.unsure,select.unsure{border:1px solid var(--warn)!important}
.stamp input.unsure{border-color:var(--warn)!important;background:var(--warn-soft)}
.data td.acts{white-space:nowrap;padding:4px 4px}
.data td.acts .icon{padding:4px 6px;color:var(--pen)}
.data td.acts .icon:hover{background:var(--pen-soft);color:var(--pen)}
.data td.acts svg{width:17px;height:17px;vertical-align:middle}
.data tr.hlrow td{background:var(--pen-soft)}
.legend{font-size:13px;color:var(--ink-2);padding:8px 18px 0}
.legend i{display:inline-block;width:14px;height:12px;vertical-align:-1px;margin-right:4px;border-radius:2px;background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn)}
@media (max-width:640px){.kv2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:50}
.toast.show{opacity:1}
.guide{max-width:78ch}
.guide li{margin:5px 0}
@media (max-width:1100px){.foot{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.foot{grid-template-columns:1fr}.split{grid-template-columns:1fr}.scanview{position:static}}
@media (max-width:540px){main{padding:14px 12px 64px}.fields{grid-template-columns:1fr}.stamp,.stamp input{width:100%}.top-in{padding:8px 12px 0}.filters input[type=search]{min-width:0;width:100%}.who{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n||0).toLocaleString('en-GB',{maximumFractionDigits:2});
const UOMS=['Nos','m','L','Roll','Gallon','Box','Pkt','Set','Kg','Drum'];
const DEPTS=['Plumbing','Electrical','AC','Civil','Night Team','Sanad Village'];
const COMMON_LOCS=['Masjid','Animal Sanctuary','Plaza Common Area','Gym Pool','Community Pool','Green Field','Common Area','Tools','Utility Workshop','Utility Pump Room','Sanad Village','Landscaping','Farm Area','Dog Park','Zain Park'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const PDF_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const monthLabel=m=>{ if(!m||m==='all') return 'All months'; const [y,mm]=m.split('-'); return (MONTHS[+mm-1]||mm)+' '+y; };

const S={tab:'scan',from:'scan',uid:null,month:'',rep:'detail',q:'',dept:'',filter:'all',rq:'',rdept:'',
  slips:new Map(),months:new Set(),me:{id:null,name:''},canWrite:null,readOnly:false,loaded:false,
  db:null,user:null,sample:null,downloads:null,aiImages:false,aiChecked:false,connected:null,
  editor:null,draft:null,scan:{pages:[],running:false,stop:false,tier:'complex',view:'detail',adding:false},names:{},cat:new Map()};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function todayISO(){ const d=new Date(),z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function newId(){ return 's-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
function monthOf(s){ return s.month||String(s.date||'').slice(0,7); }
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
function defaultMonth(){ const c=new Map(); for(const s of S.slips.values()) bump(c,monthOf(s)); const ms=[...new Set([...S.months,...c.keys()])].sort().reverse(); return ms.find(m=>(c.get(m)||0)>=3)||ms[0]||'all'; }
function latestMonth(){ const a=[...S.months].sort(); return a[a.length-1]||''; }
function slipsInMonth(){ const all=[...S.slips.values()]; return (S.month&&S.month!=='all')?all.filter(s=>monthOf(s)===S.month):all; }
function slipNoDoc(s){ return (s.lines||[]).some(l=>!effDoc(s,l)); }
function srcLabel(s){ return s.source==='import'?'Jan 2026 scans':s.source==='scan'?'Scan':'Entered'; }

/* ---------- start-up and the shared register ---------- */
async function init(){
  S.month=lsGet('sir.month')||''; S.monthAuto=!S.month; S.scan.depth=lsGet('sir.depth')||'thorough'; S.scan.par=+(lsGet('sir.par')||2); S.scan.verify=lsGet('sir.verify')!=='0';
  bindEvents(); render();
  const cl=window.claude;
  if(!cl||typeof cl.use!=='function'){ S.connected=false; S.loaded=true; setBanner('This copy is not connected to Claude, so anything you enter stays only until you close it. Open the shared link in Claude to use the register.'); render(); return; }
  const use=n=>cl.use(n).catch(()=>null);
  const [db,user,sample,downloads]=await Promise.all([use('db'),use('user'),use('sample'),use('downloads')]);
  Object.assign(S,{db,user,sample,downloads});
  if(user){
    try{ const me=await user.me(); S.me={id:me.id,name:me.name||''}; }catch(e){}
    try{ S.uid=await user.id(); }catch(e){}
    try{ const c=await user.can('data.write'); S.canWrite=c; if(c===false) S.readOnly=true; }catch(e){}
  }
  if(sample){ try{ const lim=await sample.limits(); S.aiImages=!!(lim&&lim.images); S.imgMax=(lim&&lim.images&&lim.images.maxCount)||1; }catch(e){ S.aiImages=false; } }
  S.aiChecked=true;
  if(db){ S.connected=true; watchMonths(); }
  else { S.connected=false; S.loaded=true; setBanner('The shared register is not available in this view (you may be signed out). Anything you enter now stays only until you close the page.'); }
  render();
}
const monthSubs=new Map();
function watchMonths(){
  S.db.collection('months').onSnapshot(snap=>{
    for(const d of snap.docs){ S.months.add(d.id); watchMonth(d.id); }
    if(!S.monthAuto&&S.month!=='all'&&!S.months.has(S.month)) S.monthAuto=true;
    S.loaded=true; schedule();
  },dbFail);
}
function watchMonth(m){
  if(monthSubs.has(m)) return;
  monthSubs.set(m,S.db.collection('months/'+m+'/slips').limit(1000).onSnapshot(snap=>{
    for(const ch of snap.docChanges()){
      if(ch.type==='removed'){ const cur=S.slips.get(ch.doc.id); if(cur&&monthOf(cur)===m) S.slips.delete(ch.doc.id); }
      else S.slips.set(ch.doc.id,ch.doc.data());
    }
    schedule();
  },dbFail));
}
function dbFail(e){ setBanner(e&&e.code==='revoked'?'Your access to this page changed. Reload to continue.':'Live updates stopped. Reload the page to reconnect.'); }
function dbErrText(e){
  const c=e&&e.code;
  return ({invalid_argument:'The register did not accept this change. You may have view-only access.',quota_exceeded:'The register is full. Ask the owner to archive old months.',resource_exhausted:'Too many changes at once. Wait a moment and save again.',revoked:'Your access to this page changed. Reload to continue.',unavailable:'The register could not be reached. Try saving again.'})[c]||('Saving failed'+(e&&e.message?': '+e.message:'.'));
}
async function withRetry(fn){ try{ return await fn(); }catch(e){ if(e&&e.code==='unavailable'){ await sleep(600+Math.random()*600); return fn(); } throw e; } }

/* ---------- rendering ---------- */
let raf=0;
function schedule(){ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; if(S.tab==='new'||S.tab==='edit') renderChrome(); else if(S.tab==='scan'){ renderChrome(); updateScanList(); } else render(); }); }
function curTab(){ return S.tab==='edit'?S.from:S.tab; }
function renderChrome(){
  if(S.monthAuto) S.month=defaultMonth();
  const n=slipsInMonth().length;
  const tabs=[['scan','Scan to report'],['slips','Register'],['new','New slip'],['reports','Register reports'],['sap','SAP & G/L'],['guide','Guide']];
  $('#tabs').innerHTML=tabs.map(([k,l])=>'<button type="button" data-tab="'+k+'"'+(curTab()===k?' aria-current="page"':'')+'>'+esc(l)+(k==='slips'&&S.loaded?'<span class="count">'+n+'</span>':'')+'</button>').join('');
  const months=[...S.months].sort().reverse();
  $('#monthSel').innerHTML='<option value="all"'+(S.month==='all'?' selected':'')+'>All months</option>'+months.map(m=>'<option value="'+m+'"'+(m===S.month?' selected':'')+'>'+esc(monthLabel(m))+'</option>').join('');
  $('#who').textContent=S.me.name?S.me.name+(S.readOnly?' (view only)':''):'';
}
function render(){
  renderChrome();
  const main=$('#main');
  try{
    if(S.tab==='slips') main.innerHTML=viewSlips();
    else if(S.tab==='new'){ if(!S.draft) S.draft=blankSlip(); S.editor=S.draft; main.innerHTML=viewEditor(); afterEditor(); }
    else if(S.tab==='edit'){ if(!S.editor){ S.tab='slips'; return render(); } main.innerHTML=viewEditor(); afterEditor(); }
    else if(S.tab==='scan'){ main.innerHTML=viewScan(); afterScan(); }
    else if(S.tab==='reports') main.innerHTML=viewReports();
    else if(S.tab==='sap') main.innerHTML=viewSap();
    else { const x=extraView(S.tab); main.innerHTML=(x!=null?x:viewGuide()); afterExtra(S.tab); }
  }catch(err){ console.error(err); main.innerHTML='<div class="empty">This view could not be drawn: '+esc(err.message)+'</div>'; }
}
async function goTab(k){
  if(S.tab==='edit'&&S.editor){ if(!(await leaveEditor())) return; }
  else if(S.tab==='new') pullEditor();
  if(S.tab==='edit'&&k!=='edit') S.editor=null;
  S.tab=k; render(); window.scrollTo(0,0);
}
/* ---------- slip editor ---------- */
function blankLine(){ return {sr:'',trade:'',desc:'',material:'',qty:null,uom:'Nos',unit:'',place:'',remarks:'',location:'(not stated)',locGroup:'Not stated',lineDoc:'',pay:'',status:'Issued',flag:''}; }
function blankSlip(){ return {_mode:'new',id:newId(),docNo:'',date:todayISO(),dept:lsGet('sir.lastDept')||'',technician:'',ticket:'',requestedBy:'',approvedBy:'',issuedBy:S.me.name||'',paymentTotal:'',note:'',source:'manual',sourceRef:'',form:'Digital slip',lines:[blankLine(),blankLine(),blankLine()]}; }
function editorFromSlip(s,mode){
  const e=JSON.parse(JSON.stringify(s)); e._mode=mode; e._origMonth=monthOf(s);
  e.lines=(e.lines||[]).map(l=>{ const d=deriveLoc(l);
    return Object.assign(l,{lineDoc:l.noDoc?'none':(l.docNo&&l.docNo!==e.docNo?l.docNo:''),unit:l.unit!=null?l.unit:d.unit,
      place:l.place!=null?l.place:(d.unit?'':(l.remarks||(l.locSource==='From slip'&&d.location!=='(not stated)'?d.location:'')))}); });
  if(!e.lines.length) e.lines=[blankLine()];
  return e;
}
function openSlip(id,li){ const s=S.slips.get(id); if(!s) return; if(S.tab==='new') pullEditor(); S.from=S.tab==='reports'?'reports':'slips'; S.editor=editorFromSlip(s,'edit'); S.hlLine=li==null?null:li; S.tab='edit'; render(); window.scrollTo(0,0); }
function buildCatalog(){
  const m=new Map();
  for(const s of S.slips.values()) for(const l of s.lines||[]){ const k=l.material||canon(l.desc); if(!k) continue; if(!m.has(k)) m.set(k,new Map()); bump(m.get(k),(l.sr||'')+'|'+(l.trade||'')); }
  S.cat=m; return m;
}
function bestCode(material){ const mm=S.cat.get(material); if(!mm) return null; let best='',n=0; for(const [k,c] of mm){ if(c>n){ n=c; best=k; } } const [sr,trade]=best.split('|'); return {sr,trade}; }
function datalists(){
  const cat=buildCatalog(), techs=new Set(), depts=new Set(DEPTS), units=new Set();
  for(const s of S.slips.values()){ if(s.technician) techs.add(s.technician); if(s.dept) depts.add(s.dept); for(const l of s.lines||[]){ const u=deriveLoc(l).unit; if(u) units.add(u); } }
  for(const p of S.scan.pages) if(p.draft) for(const l of p.draft.lines||[]){ const u=deriveLoc(l).unit; if(u) units.add(u); }
  const o=a=>[...a].sort((x,y)=>x.localeCompare(y,undefined,{numeric:true})).map(v=>'<option value="'+esc(v)+'"></option>').join('');
  return '<datalist id="dl-mat">'+o(cat.keys())+'</datalist><datalist id="dl-tech">'+o(techs)+'</datalist><datalist id="dl-dept">'+o(depts)+'</datalist><datalist id="dl-uom">'+o(UOMS)+'</datalist><datalist id="dl-loc">'+o(COMMON_LOCS)+'</datalist><datalist id="dl-unit">'+o(units)+'</datalist>';
}
function stClass(st){ return st==='Struck through'?'st-struck':st==='Marked X'?'st-x':''; }
function locText(rem){ const L=stdLoc(rem); return L.loc==='(not stated)'?'':'<b>'+esc(L.loc)+'</b> – '+esc(L.group); }
function unitText(v){
  const t=String(v||'').trim(); if(!t) return '';
  const us=parseUnits(t); if(!us.length) return '<span style="color:var(--stamp)">Not a unit code (use C5-TH08)</span>';
  const u=us[0]; return '<b>'+esc(u.code)+'</b> – cluster '+u.cluster.slice(1)+(u.type?', '+UTYPE_NAME[u.type].toLowerCase()+' '+u.no:', unit '+u.no+', type not written')+(us.length>1?' <span style="color:var(--stamp)">(more than one unit)</span>':'');
}
function linesHTML(){
  const e=S.editor, ro=S.readOnly&&!e.fromScan, dis=ro?' disabled':'', asWritten=e.source!=='manual';
  return e.lines.map((l,i)=>{
    const st=l.status||'Issued', ar=f=>' aria-label="Line '+(i+1)+' '+f+'"', un=new Set(l.uncertain||[]), u=(k,cls)=>{ const c=[cls,un.has(k)?'unsure':''].filter(Boolean).join(' '); return c?' class="'+c+'"':''; };
    return '<tr data-i="'+i+'" class="'+stClass(st)+(S.hlLine===i?' hl':'')+'"><td class="n">'+(i+1)+'</td>'+
    '<td><select data-f="trade"'+ar('trade')+dis+'>'+['',...TRADES].map(t=>'<option value="'+esc(t)+'"'+(t===(l.trade||'')?' selected':'')+'>'+esc(t||'–')+'</option>').join('')+'</select></td>'+
    '<td><input data-f="sr"'+u('sr')+' value="'+esc(l.sr)+'" style="width:64px"'+ar('SR code')+dis+'></td>'+
    '<td><input data-f="desc"'+u('desc','w-mat')+' list="dl-mat" value="'+esc(l.desc||l.material||'')+'"'+ar('material')+dis+'></td>'+
    '<td><input data-f="qty"'+u('qty','w-qty')+' type="number" step="any" min="0" value="'+(l.qty==null?'':esc(l.qty))+'"'+ar('quantity')+dis+'></td>'+
    '<td><input data-f="uom"'+u('uom')+' list="dl-uom" value="'+esc(l.uom||'')+'" style="width:64px"'+ar('unit of measure')+dis+'></td>'+
    '<td><div class="cell"><input data-f="unit"'+u('unit')+' list="dl-unit" value="'+esc(l.unit||'')+'" placeholder="add unit" style="width:112px"'+ar('unit (cluster and unit no.)')+dis+'>'+(ro?'':'<button type="button" class="icon cd" data-act="copyDown" data-cf="unit" data-i="'+i+'" title="Copy to every line below" aria-label="Copy to every line below">⇣</button>')+'</div><div class="loc" data-u="'+i+'">'+unitText(l.unit)+'</div></td>'+
    '<td><div class="cell"><input data-f="place"'+u('place','w-loc')+' list="dl-loc" value="'+esc(l.place||'')+'" placeholder="Masjid, Block B-210…"'+ar('other location or remarks')+dis+'>'+(ro?'':'<button type="button" class="icon cd" data-act="copyDown" data-cf="place" data-i="'+i+'" title="Copy to every line below" aria-label="Copy to every line below">⇣</button>')+'</div>'+(asWritten&&l.remarks?'<div class="loc">On the slip: '+esc(l.remarks)+'</div>':'')+'</td>'+
    '<td><div class="cell"><input data-f="lineDoc"'+u('lineDoc')+' value="'+esc(l.lineDoc||'')+'" placeholder="same" style="width:114px" inputmode="numeric"'+ar('doc no')+dis+'>'+(ro?'':'<button type="button" class="icon cd" data-act="copyDown" data-cf="lineDoc" data-i="'+i+'" title="Copy to every line below" aria-label="Copy to every line below">⇣</button>')+'</div></td>'+
    '<td><input data-f="pay"'+u('pay')+' value="'+esc(l.pay||'')+'" style="width:84px"'+ar('payment')+dis+'></td>'+
    '<td><select data-f="status"'+ar('status')+dis+'>'+STATUSES.map(x=>'<option'+(x===st?' selected':'')+'>'+x+'</option>').join('')+'</select></td>'+
    '<td>'+(ro?'':'<button type="button" class="icon" data-act="delLine" data-i="'+i+'" aria-label="Remove line '+(i+1)+'">✕</button>')+'</td></tr>'+
    (l.flag&&e.source!=='import'?'<tr class="flagrow"><td></td><td colspan="10">Check: '+esc(l.flag)+'</td><td>'+(ro?'':'<button type="button" class="link" data-act="clearFlag" data-i="'+i+'">Checked</button>')+'</td></tr>':'')+
    ((l.note||(e.source==='import'&&l.flag))?'<tr class="noterow"><td></td><td colspan="11">Reading note: '+esc(l.note||l.flag)+'</td></tr>':'');
  }).join('');
}
function docsBanner(e){
  const c=new Map();
  for(const l of e.lines||[]){ if(!(l.desc||'').trim()&&l.qty==null) continue; const d=(l.lineDoc||'').toLowerCase()==='none'?'no doc no.':(l.lineDoc||e.docNo||'no doc no.'); c.set(d,(c.get(d)||0)+1); }
  if(c.size<2) return '';
  return '<p class="legend">This slip holds '+c.size+' documents: '+[...c.entries()].map(([d,n])=>esc(d)+' ('+pl(n,'line')+')').join(', ')+'. They are reported as separate documents.</p>';
}
function editorButtons(e){
  if(S.readOnly&&!e.fromScan) return '<span class="hint">You can view this slip. Ask the owner for Contributor access to change it.</span>';
  const status='<span class="status" id="saveStatus">'+(e.fromScan?'Changes are saved as you type':'')+'</span>';
  if(e.fromScan) return '<button type="button" class="btn" data-act="applyScan">Save</button><button type="button" class="btn ghost" data-act="applyScan" data-next="1">Save and open the next page to check</button><button type="button" class="btn ghost" data-act="pagePrev">‹ Previous</button><button type="button" class="btn ghost" data-act="pageNext">Next ›</button><button type="button" class="link" data-act="closeEditor">Back to the report</button>'+status;
  if(e._mode==='new') return '<button type="button" class="btn" data-act="save">Save slip</button><button type="button" class="btn ghost" data-act="resetNew">Clear form</button>'+status;
  return '<button type="button" class="btn" data-act="save">Save changes</button>'+(e.verified?'<button type="button" class="btn ghost" data-act="verify" data-v="0">Mark as not verified</button>':'<button type="button" class="btn ghost" data-act="verify" data-v="1">Mark as verified in SAP</button>')+'<button type="button" class="btn danger" data-act="deleteSlip">Delete slip</button><button type="button" class="link" data-act="closeEditor">Back</button>'+status;
}
function viewEditor(){
  const e=S.editor, ro=(S.readOnly&&!e.fromScan)?' readonly':'';
  const pg=e.fromScan?S.scan.pages.find(p=>p.id===e.fromScan):null;
  const nav=S.scan.pages.filter(p=>p.draft), pos=pg?nav.indexOf(pg):-1;
  const title=e._mode==='new'?'New issue slip':e.fromScan?'Check page '+(pos+1)+' of '+nav.length:'Slip details';
  const unsureH=new Set(e.uncertain||[]), uc=k=>unsureH.has(k)?' class="unsure"':'';

  const form='<form class="slip" id="slipForm" autocomplete="off" novalidate>'+
   '<div class="slip-head"><div class="slip-title">Material issue slip<small>'+esc(sub)+'</small></div>'+
   '<label class="stamp">SAP material doc no.<input id="f-docNo"'+uc('docNo')+' value="'+esc(e.docNo)+'" placeholder="49xxxxxxxx" inputmode="numeric"'+ro+'></label></div>'+
   '<div class="fields"><label>Issue date<input type="date" id="f-date"'+uc('date')+' value="'+esc(e.date)+'"'+ro+'></label>'+
   '<label>Issued to<input id="f-dept"'+uc('dept')+' list="dl-dept" value="'+esc(e.dept)+'" placeholder="Plumbing, Electrical, AC…"'+ro+'></label>'+
   '<label>Technician (user)<input id="f-tech"'+uc('technician')+' list="dl-tech" value="'+esc(e.technician)+'"'+ro+'></label>'+
   '<label>Ticket / reservation no.<input id="f-ticket"'+uc('ticket')+' value="'+esc(e.ticket)+'"'+ro+'></label></div>'+
   docsBanner(e)+(anyUnsure?'<p class="legend"><i></i>Amber boxes are where Claude was not sure. Check them against the scan and type the right value; the amber goes once you change it.</p>':'')+
   '<div class="lines-wrap"><table class="lines"><thead><tr><th>#</th><th>Trade</th><th>SR code</th><th>Material</th><th>Qty</th><th>UoM</th><th>Unit</th><th>Other location / remarks</th><th>Line doc no.</th><th>Payment</th><th>Status</th><th><span class="sr-only">Remove</span></th></tr></thead><tbody id="lineRows">'+linesHTML()+'</tbody></table></div>'+
   ((S.readOnly&&!e.fromScan)?'':'<div class="actions" style="padding-top:10px"><button type="button" class="btn ghost" data-act="addLine">Add line</button><span class="hint">Unit: cluster and unit no., e.g. C5-TH08, C3-V80, C4-GV09. Lines for different units on one slip each get their own unit. ⇣ copies a unit, location or doc no. to every line below (handy for a bracket). Leave Line doc no. empty when the line uses the slip’s doc no.; type none if it has no doc no.</span></div>')+
   '<div class="foot"><label>Requested by<input id="f-req"'+uc('requestedBy')+' value="'+esc(e.requestedBy)+'"'+ro+'></label><label>Approved by<input id="f-appr"'+uc('approvedBy')+' value="'+esc(e.approvedBy||'')+'"'+ro+'></label><label>Issued by (store)<input id="f-iss"'+uc('issuedBy')+' value="'+esc(e.issuedBy)+'"'+ro+'></label><label>Payment total<input id="f-paytot"'+uc('paymentTotal')+' value="'+esc(e.paymentTotal||'')+'" placeholder="e.g. 199.50 incl. VAT"'+ro+'></label><label>Note<input id="f-note" value="'+esc(e.note)+'"'+ro+'></label></div>'+
   '<div id="msgs" class="msgs" aria-live="polite"></div><div class="actions savebar">'+editorButtons(e)+'</div><p class="hint" id="auditLine" style="padding:10px 18px 0;margin:0"></p></form>';
  const back=e._mode!=='new'?'<button type="button" class="link" data-act="closeEditor">'+(e.fromScan?'Back to the report':S.from==='reports'?'Back to reports':'Back to the register')+'</button>':'';
  const navBtns=e.fromScan?'<div class="nav"><button type="button" class="btn ghost" data-act="pagePrev"'+(pos>0?'':' disabled')+'>‹ Previous page</button><button type="button" class="btn ghost" data-act="pageNext"'+(pos>=0&&pos<nav.length-1?'':' disabled')+'>Next page ›</button>'+back+'</div>':back;
  const head='<div class="page-head"><h1>'+esc(title)+'</h1>'+navBtns+'</div>';
  if(pg&&!pg.manual){
    const tools='<div class="bar"><span>'+esc(pg.name)+' – page '+pg.pageNo+'</span><span class="tools"><button type="button" class="icon" data-act="zoomOut" aria-label="Zoom out" title="Zoom out">−</button><button type="button" class="icon" data-act="zoomFit" title="Fit to the panel">Fit</button><button type="button" class="icon" data-act="zoomIn" aria-label="Zoom in" title="Zoom in">+</button><button type="button" class="icon" data-act="viewRot" data-d="-90" aria-label="Turn left" title="Turn left">⟲</button><button type="button" class="icon" data-act="viewRot" data-d="90" aria-label="Turn right" title="Turn right">⟳</button></span></div>';
    const img=(pg.blob||pg.remoteImage)?'<img id="scanImg" style="width:'+Math.round((S.viewZoom||1)*100)+'%" alt="Scanned slip, page '+pg.pageNo+'">':'<div style="padding:14px"><p class="hint" style="margin:0 0 10px">The scan image for this page is not on this computer yet (it was read before images were kept). Choose the same PDF to bring it back; nothing is read again.</p><label class="btn ghost">Choose the PDF<input type="file" id="reattach" accept="application/pdf,.pdf,image/jpeg,image/png,image/webp" multiple class="sr-only"></label></div>';
    return '<section>'+head+'<div class="split"><figure class="scanview" id="scanview">'+tools+'<div class="imgbox">'+img+'</div></figure><div>'+form+'</div></div>'+datalists()+'</section>';
  }
  return '<section>'+head+form+datalists()+'</section>';
}
async function loadPreview(pg,imgId){

async function nameOf(id){
  if(!id) return 'someone'; if(S.names[id]) return S.names[id]; if(!S.user) return 'someone';
  try{ const ps=await S.user.profiles([id]); const n=(ps&&ps[id]&&ps[id].name)||'Someone'; S.names[id]=n; return n; }catch(e){ return 'someone'; }
}
function pullEditor(){
  const e=S.editor; if(!e||!$('#slipForm')) return;
  const v=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const resolve=(list,key,changed)=>{ if(changed&&Array.isArray(list)){ const k=list.indexOf(key); if(k>=0) list.splice(k,1); } };
  const H=[['docNo','f-docNo',x=>x.replace(/\s+/g,'')],['date','f-date'],['dept','f-dept'],['technician','f-tech'],['ticket','f-ticket'],['requestedBy','f-req'],['approvedBy','f-appr'],['issuedBy','f-iss'],['paymentTotal','f-paytot'],['note','f-note']];
  for(const [k,id,fn] of H){ if(!document.getElementById(id)) continue; let val=v(id); val=fn?fn(val):val.trim(); resolve(e.uncertain,k,String(e[k]||'')!==val); e[k]=val; }
  $$('#lineRows tr[data-i]').forEach(tr=>{
    const l=e.lines[+tr.dataset.i]; if(!l) return;
    $$('[data-f]',tr).forEach(inp=>{ const f=inp.dataset.f, val=inp.value;
      if(f==='qty'){ const q=val===''?null:Number(val); resolve(l.uncertain,'qty',q!==l.qty); l.qty=q; }
      else if(f==='lineDoc'){ const d=val.replace(/\s+/g,''); resolve(l.uncertain,'lineDoc',d!==(l.lineDoc||'')); l.lineDoc=d; }
      else { const t=val.trim(); resolve(l.uncertain,f,t!==String(l[f]==null?'':l[f])); l[f]=t; } });
    const u=parseUnits(l.unit)[0]; if(u) l.unit=u.code;
    l.material=S.cat.has(l.desc)?l.desc:canon(l.desc);
    if(e.source==='manual') l.remarks=[l.unit,l.place].filter(Boolean).join(' – ');
    const d=deriveLoc(l); l.location=d.location; l.locGroup=d.locGroup; l.locSource=(l.unit||l.place)?'Remarks':'Not stated';
  });
}
function validate(e){
  const errs=[],warns=[];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date||'')) errs.push('Enter the issue date.');
  const lines=e.lines.filter(l=>(l.desc||'').trim()||(l.qty!=null&&!Number.isNaN(l.qty)&&l.qty!==0));
  if(!lines.length) errs.push('Add at least one material line.');
  for(const l of lines){ const n=e.lines.indexOf(l)+1; if(!(l.desc||'').trim()) errs.push('Line '+n+': enter the material.'); if((l.status||'Issued')==='Issued'&&!(Number(l.qty)>0)) errs.push('Line '+n+': enter a quantity above 0.'); if(l.unit&&!parseUnits(l.unit).length) warns.push('Line '+n+': "'+l.unit+'" is not a unit code like C5-TH08.'); else if(!l.unit&&!l.place&&(l.status||'Issued')==='Issued') warns.push('Line '+n+': no unit or location is entered.'); }
  const docs=new Set(); if(e.docNo) docs.add(e.docNo);
  for(const l of lines){ if(l.lineDoc&&l.lineDoc.toLowerCase()!=='none') docs.add(l.lineDoc); }
  if(!docs.size) warns.push('There is no SAP doc no. yet. The slip will show as pending until you add it.');
  for(const d of docs){
    if(!/^49\d{8}$/.test(d)) warns.push('Doc no. '+d+' is not a 10-digit number starting with 49.');
    const other=[...S.slips.values()].filter(s=>s.id!==e.id&&(s.docNos||[]).includes(d)&&s.date!==e.date);
    if(other.length) warns.push('Doc no. '+d+' is already on '+other.length+' slip'+(other.length>1?'s':'')+' with a different date ('+other.slice(0,3).map(s=>fmtDate(s.date)).join(', ')+').');
  }
  if(e.date&&new Date(e.date+'T00:00:00').getTime()-Date.now()>86400000) warns.push('The issue date is in the future.');
  if(e.fromScan&&e.sourceRef){ const dup=[...S.slips.values()].find(s=>s.id!==e.id&&s.sourceRef===e.sourceRef); if(dup) warns.push('This scanned page is already in the register (slip dated '+fmtDate(dup.date)+').'); }
  return {errs,warns,lines};
}
function buildSlip(e,lines){
  const now=new Date().toISOString();
  const L=lines.map(l=>{ const none=(l.lineDoc||'').toLowerCase()==='none', d=deriveLoc(l);
    return {sr:l.sr||'',trade:l.trade||'',material:l.material||canon(l.desc),desc:l.desc||'',qty:l.qty==null?0:Number(l.qty),uom:l.uom||'',docNo:none?'':(l.lineDoc||''),noDoc:none,
      unit:l.unit||'',place:l.place||'',remarks:l.remarks||'',uncertain:(l.uncertain||[]).slice(),note:l.note||'',location:d.location,locGroup:d.locGroup,locSource:l.locSource||((l.unit||l.place)?'Remarks':'Not stated'),pay:l.pay||'',status:l.status||'Issued',flag:l.flag||''}; });
  const docNos=[...new Set([e.docNo,...L.map(l=>l.docNo)].filter(Boolean))];
  return {v:1,id:e.id,month:(e.date||'').slice(0,7),date:e.date||'',docNo:e.docNo||'',dept:e.dept||'',technician:e.technician||'',ticket:e.ticket||'',requestedBy:e.requestedBy||'',approvedBy:e.approvedBy||'',issuedBy:e.issuedBy||'',paymentTotal:e.paymentTotal||'',note:e.note||'',uncertain:(e.uncertain||[]).slice(),issues:(e.issues||[]).slice(),noDocOnSlip:!!e.noDocOnSlip,
    form:e.form||'Digital slip',source:e.source||'manual',sourceRef:e.sourceRef||'',lines:L,docNos,verified:!!e.verified,verifiedBy:e.verifiedBy||null,verifiedAt:e.verifiedAt||null,
    createdBy:e.createdBy||S.me.id||null,createdAt:e.createdAt||now,updatedBy:S.me.id||null,updatedAt:now};
}
async function persistSlip(slip,origMonth){
  if(S.mode==='standalone'){ addManualPage(slip); return; }
  if(!S.db){ S.slips.set(slip.id,slip); S.months.add(slip.month); return; }
  if(!S.months.has(slip.month)){ await withRetry(()=>S.db.doc('months/'+slip.month).set({month:slip.month})); S.months.add(slip.month); watchMonth(slip.month); }
  await withRetry(()=>S.db.doc('months/'+slip.month+'/slips/'+slip.id).set(slip));
  if(origMonth&&origMonth!==slip.month) await withRetry(()=>S.db.doc('months/'+origMonth+'/slips/'+slip.id).delete());
  S.slips.set(slip.id,slip);
}
function showMsgs(errs,warns,confirmNext){
  const box=$('#msgs'); if(!box) return; let h='';
  if(errs.length) h+='<ul class="err">'+errs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(warns.length) h+='<ul class="warn">'+warns.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  if(confirmNext!==undefined&&confirmNext!==null) h+='<p class="actions" style="padding:10px 0 0"><button type="button" class="btn" data-act="saveAnyway"'+(confirmNext?' data-next="1"':'')+'>Save anyway</button><button type="button" class="link" data-act="dismissMsgs">Go back and fix</button></p>';
  box.innerHTML=h; box.scrollIntoView({block:'nearest'});
}
function setSaving(b){ $$('#slipForm .actions button').forEach(x=>{ x.disabled=b; }); }
async function saveEditor(force,next){
  if(S.readOnly||!S.editor) return;
  pullEditor(); const e=S.editor, v=validate(e);
  if(v.errs.length){ showMsgs(v.errs,[],null); return false; }
  if(v.warns.length&&!force){ showMsgs([],v.warns,!!next); return false; }
  const slip=buildSlip(e,v.lines); setSaving(true);
  try{
    await persistSlip(slip,e._origMonth); S.editorDirty=false;
    if(slip.dept) lsSet('sir.lastDept',slip.dept);
    toast(e._mode==='new'?'Slip saved.':'Slip saved to the register.');
    if(e.fromScan){
      const pg=S.scan.pages.find(p=>p.id===e.fromScan); if(pg){ pg.status='saved'; pg.savedId=slip.id; }
      const nx=next&&S.scan.pages.find(p=>p.status==='read');
      if(nx){ openScanReview(nx); return; }
      S.editor=null; S.tab='scan'; render(); return;
    }
    if(e._mode==='new'){ S.draft=blankSlip(); S.draft.dept=slip.dept; S.draft.issuedBy=slip.issuedBy; render(); const f=$('#f-docNo'); if(f) f.focus(); }
    else { S.editor=editorFromSlip(slip,'edit'); render(); }
    return true;
  }catch(err){ showMsgs([dbErrText(err)],[],null); if(err&&err.code==='invalid_argument'&&S.canWrite===null){ S.readOnly=true; } return false; }
  finally{ setSaving(false); }
}
async function setVerified(id,val){
  const s=S.slips.get(id); if(!s) return;
  const patch={verified:!!val,verifiedBy:val?(S.me.id||null):null,verifiedAt:val?new Date().toISOString():null};
  try{
    if(S.db) await withRetry(()=>S.db.doc('months/'+monthOf(s)+'/slips/'+id).update(patch));
    S.slips.set(id,Object.assign({},s,patch));
    toast(val?'Marked as verified in SAP.':'Verification removed.');
    if(S.tab==='edit'&&S.editor&&S.editor.id===id){ pullEditor(); Object.assign(S.editor,patch); render(); }
  }catch(err){ toast(dbErrText(err)); if(S.tab==='slips') render(); }
}
async function deleteSlip(id){
  const s=S.slips.get(id); if(!s) return;
  try{ if(S.db) await withRetry(()=>S.db.doc('months/'+monthOf(s)+'/slips/'+id).delete()); S.slips.delete(id); S.editor=null; S.tab=S.from||'slips'; render(); toast('Slip deleted.'); }

function exportRows(rows,checks,stem,scope){
  if(!window.XLSX){ toast('The Excel library did not load, so export is unavailable.'); return; }

/* ---------- SAP issue data → General Consumables reclass (engine) ---------- */
function isoOf(v){
  if(Object.prototype.toString.call(v)==='[object Date]'&&!isNaN(v)) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'&&v>20000&&v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
  const s=String(v||'').trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
const numOf=v=>{ if(typeof v==='number') return v; const s=String(v==null?'':v).replace(/[, ]/g,'').replace(/^\((.*)\)$/,'-$1'); if(!s||s==='-') return 0; const n=Number(s); return isFinite(n)?n:0; };
const docOf=v=>{ const s=String(v==null?'':v).replace(/\.0+$/,'').replace(/\D/g,''); return /^\d{6,12}$/.test(s)?s:''; };
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;

  if(hr<0) return null;
  const H=(aoa[hr]||[]).map(c=>String(c==null?'':c).trim());
  const col=(re,not)=>H.findIndex(h=>re.test(h)&&!(not&&not.test(h)));
  const C={doc:col(/material doc/i,/nos|count|lines|aed/i),date:col(/posting date/i),desc:col(/material description|^description/i),matNo:col(/^material(\s*no\.?|\s*number)?$/i),group:col(/material group/i),item:col(/doc(ument)?\s*item|^item$/i),
    wbs:col(/wbs/i),qty:col(/issued qty|quantity|^qty/i),price:col(/unit price|^price/i),uom:col(/^unit$|^uom$|base unit|unit of measure/i),value:col(/issue value|^amount|line value|value \(aed\)/i,/all lines|g\/l|other/i),
    je:col(/journal entry/i),status:col(/^status$/i),otherGl:col(/other g\/l aed/i),glDoc:col(/^gl aed|g\/l 51570000/i),allDoc:col(/all lines/i)};
  if(C.doc<0||C.date<0||(C.value<0&&C.price<0)) return null;
  const lines=[]; let cur=null, docLevel={};

    if(doc!==cur){ cur=doc; docLevel={je:docOf(g('je')),status:String(g('status')||'').trim(),otherGl:numOf(g('otherGl')),glDoc:C.glDoc>=0?numOf(g('glDoc')):null,allDoc:C.allDoc>=0?numOf(g('allDoc')):null}; }

async function loadSapFile(f){
  if(!window.XLSX){ toast('The Excel library did not load.'); return; }
  toast('Reading '+f.name+'…');
  try{
    const wb=window.XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:'array',cellDates:true}); let best=null, sheet='';
    for(const n of wb.SheetNames){ const p=parseSapAoa(window.XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})); if(p&&p.lines.length&&(!best||p.lines.length>best.lines.length)){ best=p; sheet=n; } }
    if(!best){ toast('No sheet with Material Doc No and Posting Date columns was found in this file.'); return; }
    const docs=new Set(best.lines.map(l=>l.doc)), keep=S.sap?S.sap.lines.filter(l=>!docs.has(l.doc)):[];
    S.sap={lines:keep.concat(best.lines),file:f.name+' (sheet '+sheet+')',at:new Date().toISOString()};
    await saveSapData(S.sap); S.sapM=''; toast('SAP data loaded: '+best.lines.length.toLocaleString('en-GB')+' lines from sheet “'+sheet+'”.'); render();
  }catch(e){ toast('The file could not be read: '+((e&&e.message)||'unknown error')); }
}

const READ_PROMPT=`You are reading ONE scanned store slip ("Material Issue Slip", "Key-Issue Slip" or a SANAD slip) from The Sustainable City facility stores in Dubai. The scan may be rotated: read it in whichever orientation makes the text upright. Read EVERY detail on the page.

Form: header "THE SUSTAINABLE CITY / MATERIAL ISSUE SLIP"; fields "Ticket Nbr", "Material Issue To" (department such as Plumbing, Electrical, AC, Civil, Night Team), "Date" (dd/mm/yyyy). Table columns: SR.No, Description, Quantity, Remarks, Payment (on a Key-Issue Slip the "Location" column holds the item). Footer: Requested By, Approved, Issued By.

How this store writes the slips:
- SAP material document number: 10 digits starting with 49, e.g. 4900000185, usually at the top right and/or in the ticket row with spaces ("49 000 00 185" = 4900000185). "45000..." is a miswritten "49000...". "No number" or "NC" means no number.
- A slip can carry several numbers. Notes like "4900000241 C1 Th03" / "4900000242 C3 Th85" at the top link a number to a unit: list them in docUnitNotes and give each line the docNo of its own unit. Numbers written in the Payment column or beside a bracket belong to those lines.
- The name at the top right (Azim, Firoz, Aktar, JAK, Jakarulla, Jasvir, Nizam, Shahbaz, Jamal...) is the technician. Ticket Nbr may hold a reservation such as "R-62" or "P70562". Small notes such as "26-27-28" at the top go in slipNotes.
- The left-margin label gives each line's trade: Plum, Ele, Civil, Mech, Com or IRRI. SR.No is the store item code, usually 3 digits (002, 241).
- UNITS: a residential unit is written as cluster + type + number: "C5-TH08", "C2-TH27" (townhouse), "C3-V80" (villa), "C4/GV9" or "C1 G07" (GV unit), "5/53" (cluster 5, unit 53, type not written). "CS" means C5. Return it in "unit" as C<1-5>-<TH|V|GV><number>, e.g. "C5-TH08", or "C5-53" when no type is written.
- ONE SLIP CAN COVER SEVERAL UNITS: give every line the unit written in its own Remarks cell. A remark written once against a bracket, ditto marks or an arrow applies to each covered line. Never copy a unit onto a line that has its own different remark. If one cell lists two units, give both in "unit" separated by a comma and say so in "unclear".
- "place" is any other location or purpose: Masjid, Animal Sanctuary, Plaza, Gym Pool, Community Pool, Green Field, Common Area, Block B-210, Tools, a person's name. Put a place name in "place", never in "unit".
- Copy the Remarks cell into "remarks" on EVERY line exactly as written, also when it is a place name such as Animal Sanctuary or Plaza. A remark against a bracket or ditto marks is copied onto each covered line.
- A line crossed out with a horizontal stroke is cancelled: struck true. An x or X beside an item (when the other items are ticked) means markedX true. Ignore the diagonal stroke or Z drawn through empty rows.
- When a digit is written over another, give the final digit and say so in "unclear". Never invent a document number: give your best reading and describe any doubt in "unclear".
- Payment may hold amounts (650), "PAID", "Card" or totals with "5% VAT": copy the line amount to "payment" and any slip total to "paymentTotal".

READ THE TABLE ROW BY ROW before you build the lines, and record it in "tableRows": for every printed row from the top, write what is in Description, Quantity, Remarks and Payment, and mark the row as item, continuation (a word such as "Blue" that finishes the item above), struck, ditto, or empty. Note where a bracket } starts and ends and what is written at its point. Then build "lines" from tableRows: one line per item row, keeping the item's own remark and doc no.
Example of a slip with two doc numbers: line 1 "Shut off Luxury" has 4900000169 in its Payment cell and remark C3-TH11; a bracket spans the next rows with 4900000170 written at its point, and those rows have remarks "Block-B-210", "B.B 210" and "MASJID". Then line 1 docNo is 4900000169, every bracketed line docNo is 4900000170, each line keeps its own remark (Block B-210 for the first ones, Masjid for the last), and a crossed-out row inside the bracket is a struck line.

Reply with ONLY a JSON object, no other text:
{"rotation":0,"formType":"","docNo":"","otherDocNos":[],"docUnitNotes":[{"docNo":"","unit":""}],"date":"YYYY-MM-DD","dateAsWritten":"","issuedTo":"","technician":"","ticket":"","requestedBy":"","approvedBy":"","issuedBy":"","paymentTotal":"","slipNotes":"","confidence":"high|medium|low","uncertainFields":[],"tableRows":[{"row":1,"description":"","qty":"","remarks":"","payment":"","mark":"item|continuation|struck|ditto|empty","bracket":""}],"lines":[{"trade":"","sr":"","description":"","item":"","qty":0,"uom":"","unit":"","place":"","remarks":"","remarkSource":"own|bracket|ditto|note|none","docNo":"","payment":"","struck":false,"markedX":false,"unclear":"","uncertainFields":[]}]}
"uncertainFields" lists only IMPORTANT fields you still cannot read after looking closely: on the slip docNo and date; on a line description, qty, unit, place and docNo. List a field only when the writing is truly unreadable or two different readings are equally likely – not because the handwriting is untidy, and never for signatures, names, SR codes, units of measure or payment. Always give your best reading in the field itself.
"unclear" is at most 12 words and only for a real doubt about an important field (e.g. "qty 4 written over 1"). Do not describe signatures, ticks, lines drawn on the page or the layout. "slipNotes" is only for words on the slip that matter (No number, NC, batch notes, PAID, totals), at most 15 words.
"item" is the exact name from the Known store items list that the line is (for example "Shut-off Valve - Luxury" for "Shut off Luxury"), or "" when the item is not on the list. "description" stays as written.
"rotation" is how many degrees the image must be turned clockwise to read upright (0, 90, 180 or 270). "remarks" is the remark exactly as written for that line. One entry per item line; join a description that continues on the next row. qty is a number (1.5 for 1.5 m) with the unit of measure in uom (m, L, Roll, Gallon). Use "" for blank fields. If the page is not a store issue slip, reply {"lines":[],"slipNotes":"not a slip"}.`;

function hintsItems(){
  const cat=buildCatalog(), items=[];
  for(const [m,codes] of cat){ let best='',n=0,tot=0; for(const [k,c] of codes){ tot+=c; if(c>n){ n=c; best=k; } } const [sr,tr]=best.split('|'); items.push([tot,(sr||'---')+' '+(tr||'')+' '+m]); }
  items.sort((a,b)=>b[0]-a[0]);
  const techs=new Set(typeof BASE_TECHS!=='undefined'?BASE_TECHS:[]);
  for(const sl of S.slips.values()) if(sl.technician) techs.add(sl.technician);
  let t='';
  if(items.length) t+='\n\nKnown store items (SR code, trade, name). Use this list to recognise hard-to-read item names and codes, but write what is on the slip and never add an item that is not written:\n'+items.slice(0,220).map(x=>x[1]).join('\n');
  if(techs.size) t+='\n\nKnown technicians and staff: '+[...techs].slice(0,60).join(', ')+'.';
  return t;
}

const safeName=v=>String(v||'').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,40);
async function backupMonth(m){
  if(!window.JSZip){ toast('The backup library did not load.'); return; }
  if(!S.downloads){ toast('Saving files is not available in this view.'); return; }
  const pages=S.scan.pages.filter(p=>pageMonth(p)===m).slice().sort((a,b)=>String(a.draft&&a.draft.date).localeCompare(String(b.draft&&b.draft.date))||String(a.draft&&a.draft.docNo).localeCompare(String(b.draft&&b.draft.docNo))||(a.order||0)-(b.order||0));
  if(!pages.length){ toast('Nothing to back up for '+monthName(m)+'.'); return; }
  toast('Preparing the backup for '+monthName(m)+'…');
  for(const pg of pages) if(!pg.blob&&pg.remoteImage&&typeof cloudBlob==='function') await cloudBlob(pg);
  const zip=new window.JSZip(), recs=[], used=new Set(); let n=0, noImg=0;
  for(const pg of pages){
    const d=pg.draft||{}; let base=[d.date||'no-date',d.docNo||'no-doc',safeName(d.technician)||'',safeName((pg.name||'').replace(/\.pdf$/i,''))+'-p'+String(pg.pageNo).padStart(3,'0')].filter(Boolean).join('__');
    let name=base, k=2; while(used.has(name)) name=base+'_'+(k++); used.add(name);
    let image=null; if(pg.blob){ image='scans/'+name+'.jpg'; zip.file(image,pg.blob,{binary:true}); n++; } else noImg++;
    recs.push(Object.assign(pageRecord(pg),{image}));
  }
  zip.file('slips.json',JSON.stringify({app:'Stores Issue Register',kind:'month-backup',version:1,month:m,created:new Date().toISOString(),pages:recs},null,1));
  const rows=flatten(slipsOf(pages.filter(p=>p.draft)));
  if(rows.length&&window.XLSX){ const buf=buildWorkbook(rows,docChecks(rows),monthName(m)+' – backup'); if(buf) zip.file('Material_Issue_Report_'+m+'.xlsx',buf); }
  zip.file('READ ME.txt','Stores issue register – backup for '+monthName(m)+'\r\n\r\nscans\\  the scan of every slip, named date__doc no__technician__source page\r\nMaterial_Issue_Report_'+m+'.xlsx  the full report for the month\r\nslips.json  everything read and corrected (used to restore)\r\n\r\nTo restore: open the app, Scan to report > Months & backups > Choose a backup.\r\n');
  try{
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
    await S.downloads.save({filename:'TSC_Stores_Backup_'+m+'.zip',data:blob});
    toast('Backup for '+monthName(m)+' saved: '+pl(pages.length,'slip')+', '+pl(n,'scan')+(noImg?' ('+noImg+' without a scan on this computer)':'')+'.');
  }catch(e){ if(e&&e.code==='declined') return; toast('The backup could not be saved'+(e&&e.message?': '+e.message:'.')); }
}
async function makeThumb(blob){ const bmp=await createImageBitmap(blob), k=220/Math.max(bmp.width,bmp.height), c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k)); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); if(bmp.close) bmp.close(); return c.toDataURL('image/jpeg',0.72); }
async function restoreBackup(file){
  if(!window.JSZip){ toast('The backup library did not load.'); return; }
  toast('Reading the backup…');
  let zip, meta;
  try{ zip=await window.JSZip.loadAsync(file); const f=zip.file('slips.json'); if(!f) throw new Error('slips.json is missing'); meta=JSON.parse(await f.async('string')); }
  catch(e){ toast('This is not a backup made by this app ('+((e&&e.message)||'unreadable')+').'); return; }
  let added=0, back=0, kept=0;
  const shared=typeof CLOUD!=='undefined'&&CLOUD.on; if(shared) CLOUD.bulk=new Set();
  for(const r of (meta.pages||[])){
    if(!r||!r.key) continue;
    let blob=null; if(r.image&&zip.file(r.image)) blob=new Blob([await zip.file(r.image).async('arraybuffer')],{type:'image/jpeg'});
    const ex=S.scan.pages.find(p=>p.key===r.key);
    if(ex){ if(!ex.blob&&blob){ ex.blob=blob; ex.thumb=await makeThumb(blob); ex.preview=''; keepImage(ex); back++; } else kept++; continue; }
    const id='pg'+Math.random().toString(36).slice(2,9), d=r.draft||null; if(d) d.fromScan=id;
    const pg={id,name:r.name,pageNo:r.page,fileKey:r.fileKey||'',key:r.key,blob,thumb:blob?await makeThumb(blob):'',rot:r.rot||0,aiRot:r.aiRot||0,rotKnown:true,status:d?'read':'new',draft:d,error:'',preview:'',checked:!!r.checked,manual:!!r.manual,order:r.order||0};
    S.scan.pages.push(pg); cacheRead(pg); keepImage(pg); added++;
  }
  S.scan.pages.sort((a,b)=>(a.order||0)-(b.order||0));
  if(shared){ const b=[...CLOUD.bulk]; CLOUD.bulk=null; refreshScan(true); const r=await cloudBulkSave(b,'Saving the backup to the shared database'); const c=await cloudCounts();
    toast('Backup restored and saved to the shared database: '+pl(r.rows,'slip')+', '+pl(r.imgs,'scan')+(r.fail?' – '+r.fail+' could not be saved, see the message at the top':'')+'. The shared database now holds '+pl(c.pages,'slip')+'.'); refreshScan(true); return; }
  toast('Backup restored: '+pl(added,'slip')+' added'+(back?', '+pl(back,'scan')+' put back':'')+(kept?', '+kept+' already here':'')+'.');
  refreshScan(true);
}

function buildCatalog(){
  const m=new Map(), add=(k,sr,tr)=>{ if(!k) return; if(!m.has(k)) m.set(k,new Map()); bump(m.get(k),(sr||'')+'|'+(tr||'')); };
  for(const [k,sr,tr] of BASE_CATALOG) add(k,sr,tr);
  for(const p of S.scan.pages) if(p.draft) for(const l of p.draft.lines||[]) add(l.material||canon(l.desc),l.sr,l.trade);

let idbP=null, idbBlocked=false;
const BLOCKED_MSG='An older copy of this page is still open in another tab or window. Close every other tab with this page, then reload this one. Until then, nothing you do here is kept after closing.';
function idb(){
  if(!idbP) idbP=new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('no browser storage')); return; }
    let done=false; const fail=e=>{ if(!done){ done=true; rej(e); } };
    let r; try{ r=indexedDB.open('stores-issue-register',3); }catch(e){ fail(e); return; }
    r.onupgradeneeded=()=>{ const d=r.result; for(const n of ['reads','batch','images','sap']) if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'key'}); };
    r.onsuccess=()=>{ const d=r.result; d.onversionchange=()=>{ try{ d.close(); }catch(e){} }; if(done){ try{ d.close(); }catch(e){} return; } done=true; res(d); };
    r.onerror=()=>fail(r.error||new Error('storage error'));
    r.onblocked=()=>{ idbBlocked=true; setBanner(BLOCKED_MSG); };
    setTimeout(()=>fail(new Error('storage did not answer')),6000);
  });
  return idbP;
}
async function idbDo(store,mode,fn){ const d=await idb(); return new Promise((res,rej)=>{ const tx=d.transaction(store,mode), st=tx.objectStore(store); const rq=fn(st); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
const idbPut=(s,v)=>idbDo(s,'readwrite',st=>st.put(v)).catch(()=>{});
const idbDel=(s,k)=>idbDo(s,'readwrite',st=>st.delete(k)).catch(()=>{});

async function restoreReads(fk){

  t.width=Math.max(1,Math.round(c.width*k)); t.height=Math.max(1,Math.round(c.height*k)); t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  const thumb=t.toDataURL('image/jpeg',0.72); c.width=c.height=0;
  const key='read_'+hash36(fk+'|'+no), ex=S.scan.pages.find(p=>p.key===key);
  if(ex){ ex.blob=blob; ex.thumb=thumb; ex.preview=''; keepImage(ex); return; }
  const pg={id:'pg'+Math.random().toString(36).slice(2,9),name,pageNo:no,fileKey:fk,key,blob,thumb,rot:0,aiRot:0,status:'new',draft:null,error:'',preview:'',order:Date.now()*100+no};
  S.scan.pages.push(pg); keepImage(pg); if(!CLOUD.on) idbPut('batch',pageRecord(pg));
}
function addManualPage(slip){
  const ex=S.scan.pages.find(p=>p.manual&&p.draft&&p.draft.id===slip.id);
  const e=JSON.parse(JSON.stringify(S.editor||{})); e.id=slip.id; e._mode='scan'; e.source='manual';
  if(ex){ e.fromScan=ex.id; e.sourceRef=ex.draft.sourceRef; ex.draft=e; cacheRead(ex); return; }
  const n=S.scan.pages.filter(p=>p.manual).length+1, id='pg'+Math.random().toString(36).slice(2,9);
  e.fromScan=id; e.sourceRef='Typed slip '+n;
  const pg={id,name:'Typed slip',pageNo:n,fileKey:'',key:'manual_'+slip.id,blob:null,thumb:'',rot:0,aiRot:0,status:'read',draft:e,error:'',preview:'',checked:true,manual:true,order:Date.now()*100};
  S.scan.pages.push(pg); cacheRead(pg);
}

/* ---- Claude API (direct from the browser) ---- */
async function apiCall(body){
  const proxy=useProxy();
  if(!S.apiKey&&!proxy) throw {code:'not_granted',message:'No API key'};
  let wait=4000;
  for(let attempt=0;attempt<4;attempt++){
    let res;
    try{
      if(proxy){ const ss=(await cloudClient().auth.getSession()).data.session, c=cloudConf();
        res=await fetch(c.url+'/functions/v1/claude',{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+(ss&&ss.access_token||''),'apikey':c.key},body:JSON.stringify(body)}); }
      else res=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    }
    catch(e){ throw {code:'network',message:proxy?'Could not reach the shared Claude reader. Check the internet connection, or ask the administrator whether the "claude" function is deployed.':'Could not reach the Claude API. Check the internet connection.'}; }
    if(res.ok) return res.json();
    if(proxy&&res.status===404) throw {code:'proxy_missing'};
    if(proxy&&res.status===401) throw {code:'proxy_auth'};
    if(res.status===401||res.status===403) throw {code:'not_granted',message:'The API key was not accepted.'};
    if(res.status===429||res.status===529||res.status>=500){
      if(attempt===3) throw {code:res.status===429?'rate_limited':'upstream_error'};
      const ra=Number(res.headers&&res.headers.get&&res.headers.get('retry-after'));
      await sleep(ra>0?Math.min(ra*1000,60000):wait); wait*=2; continue;
    }
    let msg=''; try{ const j=await res.json(); msg=j&&j.error&&j.error.message||''; }catch(e){}
    throw {code:res.status===400?'invalid_request':'upstream_error',message:msg||('HTTP '+res.status)};
  }
}
async function imageForApi(blob){
  const bmp=await createImageBitmap(blob), k=Math.min(1,1568/Math.max(bmp.width,bmp.height)), c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k)); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); if(bmp.close) bmp.close();
  const url=await blobToDataURL(await toBlob(c,'image/jpeg',0.88)); return url.slice(url.indexOf(',')+1);
}
function parseJsonText(text){
  let t=String(text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<a) throw {code:'invalid_json'};
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ throw {code:'invalid_json'}; }
}
function apiSample(){
  const f=async()=>{ throw {code:'invalid_request'}; };
  f.limits=async()=>({maxPromptBytes:262144,images:{maxCount:5,maxInputBytes:20000000,mediaTypes:['image/jpeg','image/png','image/webp']}});
  f.json=async(prompt,opts)=>{
    const imgs=(opts&&opts.images)||[], content=[], parts=String(prompt).split(SPLIT);
    if(parts.length>1) content.push({type:'text',text:parts[0],cache_control:{type:'ephemeral'}});
    for(const b of imgs) content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await imageForApi(b)}});
    content.push({type:'text',text:parts.length>1?[parts.slice(1).join('\n\n').trim(),'Read the slip shown in the images above and reply with only the JSON object described.'].filter(Boolean).join('\n\n'):prompt});
    const j=await apiCall({model:opts&&opts.fast?'claude-haiku-4-5-20251001':S.model,max_tokens:opts&&opts.fast?200:8000,messages:[{role:'user',content}]});
    addUsage(j.usage,!(opts&&opts.fast));
    const text=(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
    if(!text.trim()) throw {code:'empty_completion'};
    return parseJsonText(text);
  };
  return f;
}
function addUsage(u,isRead){
  if(!u) return; const g=S.usage||(S.usage={reads:0,input:0,cacheRead:0,cacheWrite:0,output:0});
  if(isRead) g.reads++; g.input+=u.input_tokens||0; g.cacheRead+=u.cache_read_input_tokens||0; g.cacheWrite+=u.cache_creation_input_tokens||0; g.output+=u.output_tokens||0;
}
function usageHTML(){
  const g=S.usage; if(!g||!g.reads) return '';
  const k=n=>Math.round(n).toLocaleString('en-GB'), inp=g.input+g.cacheWrite;
  return '<p class="hint" style="margin:-4px 0 10px">API use since this page was opened: '+pl(g.reads,'slip read')+', '+k(inp)+' input tokens, '+k(g.cacheRead)+' input tokens from the prompt cache (billed at a reduced rate), '+k(g.output)+' output tokens. About '+k((inp+g.cacheRead)/g.reads)+' input and '+k(g.output/g.reads)+' output tokens per slip.</p>';
}
function browserDownloads(){
  return {save:async({filename,data})=>{
    const blob=data instanceof Blob?data:new Blob([data]); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); return 'saved';
  }};
}
function useProxy(){ return !S.apiKey&&CLOUD.on&&!!CLOUD.user; }
function canRead(){ return !!(S.sample&&(S.apiKey||useProxy())); }
function readWarnText(){ return 'Add your Claude API key on the Settings tab to read scans.'; }
function sampleErrText(e){
  const c=e&&e.code;
  if(c==='proxy_missing') return 'The shared Claude reader is not set up yet. Ask the administrator to deploy the "claude" function in Supabase, or enter your own API key on the Settings tab.';
  if(c==='proxy_auth') return 'Your sign-in has expired. Sign out and sign in again.';
  if(c==='not_granted') return useProxy()?'The company Claude key on the server was not accepted. Ask the administrator to check the ANTHROPIC_API_KEY secret in Supabase.':'The API key was not accepted. Check it on the Settings tab.';
  if(c==='network') return e.message;
  if(c==='rate_limited') return 'The API is busy or the account limit was reached. Wait a minute, then press Read again.';
  if(c==='invalid_json') return 'The answer was not in the expected format. Read the page again.';
  if(c==='empty_completion') return 'Claude returned an empty answer. Read the page again.';
  if(c==='invalid_request') return 'The API refused the request'+(e.message?': '+e.message:'.')+' Check the model on the Settings tab.';
  if(c==='upstream_error') return 'The Claude API had a problem'+(e.message?' ('+e.message+')':'')+'. Try again.';
  return 'Reading failed'+(e&&e.message?': '+e.message:'.');
}
